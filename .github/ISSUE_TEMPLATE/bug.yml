name: Bug
description: Report a product defect with reproducible details.
title: "[Bug]: "
labels: ["bug", "status:triage", "agent:seniordev", "sev:P2"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner Agent
      options:
        - agent:seniordev
        - agent:juniordev
        - agent:pm
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - sev:P1
        - sev:P2
        - sev:P0
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Initial Status
      options:
        - status:triage
        - status:ready
        - status:in-progress
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - Bug no longer reproduces
        - Tests cover regression path
    validations:
      required: true
